[package]
name = "gaeb-toolkit"
version = "0.1.0"
edition = "2021"
description = "Parse German construction bills of quantities from PDF into structured data"
license = "MIT"
repository = "https://github.com/reuak/gaeb-toolkit"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
printpdf = { version = "0.7", default-features = false }
quick-xml = { version = "0.37", features = ["serialize"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.22"
rust_decimal = { version = "1", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "sync", "time"] }
tower-http = { version = "0.6", features = ["limit", "trace", "fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
pretty_assertions = "1"
