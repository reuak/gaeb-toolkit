services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DAILY_LIMIT: ${DAILY_LIMIT:-2}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2097152}
      RETENTION_HOURS: ${RETENTION_HOURS:-24}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - gaeb-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  gaeb-data:
  caddy-data:
  caddy-config:
