services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DAILY_LIMIT: ${DAILY_LIMIT:-2}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2097152}
      RETENTION_HOURS: ${RETENTION_HOURS:-24}
      DIAGNOSTIC_RETENTION_DAYS: ${DIAGNOSTIC_RETENTION_DAYS:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GOOGLE_TAG_MANAGER_ID: ${GOOGLE_TAG_MANAGER_ID:-GTM-TF86FD6Z}
      GOOGLE_ANALYTICS_ID: ${GOOGLE_ANALYTICS_ID:-}
      META_PIXEL_ID: ${META_PIXEL_ID:-}
      KLICKTIPP_PIXEL_URL: ${KLICKTIPP_PIXEL_URL:-}
      COOKIE_CONSENT_VERSION: ${COOKIE_CONSENT_VERSION:-1}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - gaeb-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  gaeb-data:
  caddy-data:
  caddy-config:
