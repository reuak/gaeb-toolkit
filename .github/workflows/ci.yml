name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Temporarily format on the runner to run clippy/tests while legacy files
      # still contain rustfmt differences. Restore --check after formatting commits.
      - run: cargo fmt --all
      # One-off formatting commit for the existing Rust style debt in this PR branch.
      - name: Commit rustfmt output on feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/dolibarr-lv-import-20261029'
        run: |
          if ! git diff --quiet -- '*.rs'; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- '*.rs'
            git commit -m 'Apply rustfmt to Rust sources'
            git push origin HEAD:refs/heads/fix/dolibarr-lv-import-20261029
          fi
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
